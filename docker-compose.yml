services:
  postgres:
    image: postgres:17
    container_name: gatekeep_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatekeep
      POSTGRES_PASSWORD: gatekeep_secret
      POSTGRES_DB: gatekeep
    ports:
      # HOST:CONTAINER — expose 5432 on your machine
      - "5433:5432"
    volumes:
      # Persist data across container restarts
      - gatekeep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gatekeep -d gatekeep" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gatekeep_pg_data:
